<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Arun Saloon – Owner Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:wght@300;400;600&family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #0a0a0a;
      --cream: #f2ede8;
      --red: #c0392b;
      --red-dark: #96281b;
      --gold: #b8975a;
      --gray-dark: #1a1a1a;
      --gray-mid: #2c2c2c;
      --gray-light: #e8e2da;
      --text-muted: #888;
      --font-display: 'Playfair Display', serif;
      --font-script: 'Cormorant Garamond', serif;
      --font-heading: 'Bebas Neue', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }

    body {
      background: var(--cream);
      font-family: var(--font-body);
      min-height: 100vh;
      color: var(--black);
    }

    /* ── HEADER ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      background: var(--cream);
      border-bottom: 1px solid var(--gray-light);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      font-size: 22px;
      color: var(--black);
      letter-spacing: -2px;
    }

    .brand-text h1 {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--black);
      line-height: 1;
    }

    .brand-text p {
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .settings-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border: 1.5px solid var(--black);
      background: transparent;
      border-radius: 4px;
      font-family: var(--font-body);
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      color: var(--black);
      transition: all 0.2s;
    }

    .settings-btn:hover {
      background: var(--black);
      color: var(--cream);
    }

    /* ── HERO PANEL ── */
    .hero-panel {
      background: var(--black);
      margin: 16px;
      border-radius: 12px;
      padding: 28px 24px 24px;
      position: relative;
      overflow: hidden;
    }

    .hero-panel::before {
      content: '';
      position: absolute;
      top: -40px; right: -40px;
      width: 180px; height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(192,57,43,0.15), transparent 70%);
      pointer-events: none;
    }

    .now-serving-label {
      font-family: var(--font-body);
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .ticket-number {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 90px;
      line-height: 1;
      color: var(--cream);
      letter-spacing: -2px;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .ticket-number.bump {
      transform: scale(1.08);
      color: #fff;
    }

    .next-btn {
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-family: var(--font-heading);
      font-size: 18px;
      letter-spacing: 3px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      position: relative;
      overflow: hidden;
    }

    .next-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.08), transparent);
    }

    .next-btn:hover { background: var(--red-dark); }
    .next-btn:active { transform: scale(0.98); }

    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .stat-card {
      background: var(--gray-mid);
      border-radius: 8px;
      padding: 14px 16px;
    }

    .stat-label {
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .stat-value {
      font-family: var(--font-script);
      font-size: 38px;
      color: var(--cream);
      line-height: 1;
    }

    /* ── QUEUE SECTION ── */
    .queue-section {
      margin: 0 16px 16px;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .queue-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--gray-light);
    }

    .queue-title {
      font-family: var(--font-script);
      font-size: 26px;
      color: var(--black);
      font-weight: 400;
    }

    .badge {
      background: var(--gray-light);
      color: var(--black);
      font-size: 10px;
      letter-spacing: 2px;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      font-weight: 500;
    }

    .badge.has-people {
      background: var(--red);
      color: #fff;
    }

    .queue-empty {
      padding: 28px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }

    .queue-list {
      padding: 0;
    }

    .queue-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--gray-light);
      animation: slideIn 0.3s ease;
    }

    .queue-item:last-child { border-bottom: none; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .queue-num {
      font-family: var(--font-heading);
      font-size: 20px;
      color: var(--red);
      width: 36px;
    }

    .queue-name {
      flex: 1;
      font-size: 14px;
      font-weight: 500;
      color: var(--black);
      padding-left: 8px;
    }

    .queue-time {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ── ADD CUSTOMER ── */
    .add-section {
      margin: 0 16px 24px;
    }

    .add-btn {
      width: 100%;
      padding: 14px;
      background: transparent;
      border: 1.5px dashed var(--gray-mid);
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 13px;
      letter-spacing: 1px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .add-btn:hover {
      border-color: var(--red);
      color: var(--red);
      background: rgba(192,57,43,0.03);
    }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      display: flex; align-items: flex-end;
      z-index: 100;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s;
    }

    .modal-overlay.open {
      opacity: 1; pointer-events: all;
    }

    .modal {
      background: var(--cream);
      width: 100%;
      border-radius: 20px 20px 0 0;
      padding: 24px 20px 36px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.34,1.2,0.64,1);
    }

    .modal-overlay.open .modal {
      transform: translateY(0);
    }

    .modal-handle {
      width: 40px; height: 4px;
      background: #ccc;
      border-radius: 2px;
      margin: 0 auto 20px;
    }

    .modal h3 {
      font-family: var(--font-display);
      font-size: 20px;
      margin-bottom: 16px;
    }

    .modal input {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid var(--gray-light);
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 15px;
      background: #fff;
      outline: none;
      margin-bottom: 14px;
      transition: border-color 0.2s;
    }

    .modal input:focus { border-color: var(--black); }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-cancel {
      padding: 13px;
      border: 1.5px solid var(--gray-light);
      background: transparent;
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 14px;
      cursor: pointer;
      color: var(--text-muted);
    }

    .btn-confirm {
      padding: 13px;
      border: none;
      background: var(--black);
      color: var(--cream);
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    /* ── SETTINGS PANEL ── */
    .settings-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      display: flex; align-items: flex-end;
      z-index: 100;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s;
    }

    .settings-overlay.open {
      opacity: 1; pointer-events: all;
    }

    .settings-panel {
      background: var(--cream);
      width: 100%;
      border-radius: 20px 20px 0 0;
      padding: 24px 20px 40px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.34,1.2,0.64,1);
    }

    .settings-overlay.open .settings-panel {
      transform: translateY(0);
    }

    .settings-panel h3 {
      font-family: var(--font-display);
      font-size: 20px;
      margin-bottom: 20px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid var(--gray-light);
    }

    .setting-row label {
      font-size: 14px;
      color: var(--black);
    }

    .setting-row span {
      font-size: 12px;
      color: var(--text-muted);
      display: block;
      margin-top: 2px;
    }

    .setting-input {
      width: 70px;
      padding: 7px 10px;
      border: 1.5px solid var(--gray-light);
      border-radius: 6px;
      font-size: 14px;
      text-align: center;
      background: #fff;
      outline: none;
    }

    .reset-btn {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: 1.5px solid var(--red);
      background: transparent;
      color: var(--red);
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .reset-btn:hover { background: var(--red); color: #fff; }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 30px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--black);
      color: var(--cream);
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 13px;
      letter-spacing: 0.5px;
      z-index: 200;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34,1.2,0.64,1);
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="brand">
      <div class="brand-icon">✂</div>
      <div class="brand-text">
        <h1>Arun Saloon</h1>
        <p>Owner Dashboard</p>
      </div>
    </div>
    <button class="settings-btn" onclick="openSettings()">⚙ Settings</button>
  </header>

  <!-- HERO -->
  <div class="hero-panel">
    <div class="now-serving-label">Now Serving</div>
    <div class="ticket-number" id="ticketNum">#0</div>
    <button class="next-btn" onclick="nextCustomer()">Next Customer</button>
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Waiting</div>
        <div class="stat-value" id="waitingCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Avg Wait</div>
        <div class="stat-value" id="avgWait">25m</div>
      </div>
    </div>
  </div>

  <!-- QUEUE -->
  <div class="queue-section">
    <div class="queue-header">
      <div class="queue-title">Saloon</div>
      <div class="badge" id="queueBadge">0 Waiting</div>
    </div>
    <div id="queueList" class="queue-list">
      <div class="queue-empty" id="emptyMsg">Abhi koi waiting nahi hai 🎉</div>
    </div>
  </div>

  <!-- ADD BUTTON -->
  <div class="add-section">
    <button class="add-btn" onclick="openModal()">+ Customer Add Karein</button>
  </div>

  <!-- ADD MODAL -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
    <div class="modal">
      <div class="modal-handle"></div>
      <h3>Customer Add Karein</h3>
      <input type="text" id="customerName" placeholder="Customer ka naam (optional)" />
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-confirm" onclick="addCustomer()">Add Karein</button>
      </div>
    </div>
  </div>

  <!-- SETTINGS PANEL -->
  <div class="settings-overlay" id="settingsOverlay" onclick="closeSettingsOutside(event)">
    <div class="settings-panel">
      <div class="modal-handle"></div>
      <h3>Settings</h3>
      <div class="setting-row">
        <div>
          <label>Avg Service Time</label>
          <span>Minutes per customer</span>
        </div>
        <input type="number" class="setting-input" id="avgTime" value="25" min="1" onchange="updateAvgWait()"/>
      </div>
      <div class="setting-row">
        <div>
          <label>Saloon ka Naam</label>
          <span>Dashboard title</span>
        </div>
      </div>
      <button class="reset-btn" onclick="resetAll()">🔄 Queue Reset Karein</button>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script>
    let currentNum = 0;
    let queue = [];
    let nextId = 1;
    let avgTimePerCustomer = 25;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function renderQueue() {
      const list = document.getElementById('queueList');
      const empty = document.getElementById('emptyMsg');
      const badge = document.getElementById('queueBadge');
      const waitingCount = document.getElementById('waitingCount');
      const avgWait = document.getElementById('avgWait');

      badge.textContent = queue.length + ' Waiting';
      badge.className = 'badge' + (queue.length > 0 ? ' has-people' : '');
      waitingCount.textContent = queue.length;
      avgWait.textContent = (queue.length * avgTimePerCustomer) + 'm';

      if (queue.length === 0) {
        list.innerHTML = '<div class="queue-empty" id="emptyMsg">Abhi koi waiting nahi hai 🎉</div>';
        return;
      }

      list.innerHTML = queue.map((c, i) => `
        <div class="queue-item">
          <div class="queue-num">#${currentNum + i + 1}</div>
          <div class="queue-name">${c.name || 'Guest'}</div>
          <div class="queue-time">~${(i + 1) * avgTimePerCustomer}m</div>
        </div>
      `).join('');
    }

    function nextCustomer() {
      if (queue.length === 0) {
        currentNum++;
        document.getElementById('ticketNum').textContent = '#' + currentNum;
        bumpAnimation();
        showToast('Koi waiting nahi hai abhi!');
        renderQueue();
        return;
      }
      queue.shift();
      currentNum++;
      const el = document.getElementById('ticketNum');
      el.textContent = '#' + currentNum;
      bumpAnimation();
      showToast('✅ Next customer bulaya gaya — #' + currentNum);
      renderQueue();
    }

    function bumpAnimation() {
      const el = document.getElementById('ticketNum');
      el.classList.add('bump');
      setTimeout(() => el.classList.remove('bump'), 400);
    }

    function openModal() {
      document.getElementById('modalOverlay').classList.add('open');
      setTimeout(() => document.getElementById('customerName').focus(), 350);
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
      document.getElementById('customerName').value = '';
    }

    function closeModalOutside(e) {
      if (e.target === document.getElementById('modalOverlay')) closeModal();
    }

    function addCustomer() {
      const name = document.getElementById('customerName').value.trim();
      queue.push({ id: nextId++, name: name || '' });
      closeModal();
      showToast('✅ Customer add ho gaya! Queue: ' + queue.length);
      renderQueue();
    }

    function openSettings() {
      document.getElementById('settingsOverlay').classList.add('open');
    }

    function closeSettingsOutside(e) {
      if (e.target === document.getElementById('settingsOverlay')) {
        document.getElementById('settingsOverlay').classList.remove('open');
      }
    }

    function updateAvgWait() {
      avgTimePerCustomer = parseInt(document.getElementById('avgTime').value) || 25;
      renderQueue();
    }

    function resetAll() {
      if (!confirm('Queue aur counter reset karein?')) return;
      queue = [];
      currentNum = 0;
      nextId = 1;
      document.getElementById('ticketNum').textContent = '#0';
      document.getElementById('settingsOverlay').classList.remove('open');
      showToast('🔄 Queue reset ho gaya!');
      renderQueue();
    }

    // Enter key support
    document.getElementById('customerName').addEventListener('keydown', e => {
      if (e.key === 'Enter') addCustomer();
      if (e.key === 'Escape') closeModal();
    });

    renderQueue();
  </script>
</body>
</html>
