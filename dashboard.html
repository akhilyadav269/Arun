<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arun Saloon - Owner Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #f5f0eb; color: #0a0a0a; min-height: 100vh; }
    .dash-header { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid #ddd; background: #f5f0eb; }
    .dash-brand { font-family: 'Bebas Neue', cursive; font-size: 20px; letter-spacing: 3px; }
    .dash-subtitle { font-size: 10px; letter-spacing: 2px; color: #888; }
    .settings-btn { background: #fff; border: 1px solid #ddd; border-radius: 2px; padding: 8px 14px; font-size: 12px; cursor: pointer; font-family: 'DM Sans', sans-serif; }
    .settings-panel { background: #fff; margin: 12px; border-radius: 4px; padding: 20px; border: 1px solid #e0d8d0; display: none; }
    .s-label { display: block; font-size: 11px; color: #888; margin-bottom: 6px; margin-top: 12px; }
    .s-input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 2px; font-size: 15px; font-family: 'DM Sans', sans-serif; outline: none; }
    .save-btn { width: 100%; margin-top: 16px; padding: 12px; background: #0a0a0a; color: #f0e8dc; border: none; border-radius: 2px; font-size: 14px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-weight: 600; }
    .serving-card { background: #0a0a0a; color: #f0e8dc; margin: 12px; border-radius: 4px; padding: 24px; }
    .serving-label { font-size: 11px; letter-spacing: 3px; color: #888; margin-bottom: 4px; }
    .serving-number { font-family: 'Bebas Neue', cursive; font-size: 80px; line-height: 1; }
    .serving-phone { font-size: 14px; color: #aaa; margin-bottom: 16px; margin-top: 4px; }
    .next-btn { width: 100%; padding: 14px; background: #e63329; color: #fff; border: none; border-radius: 2px; font-size: 14px; font-weight: 700; cursor: pointer; margin-bottom: 20px; font-family: 'DM Sans', sans-serif; letter-spacing: 2px; }
    .stats-row { display: flex; gap: 12px; }
    .stat-box { flex: 1; background: rgba(255,255,255,0.08); border-radius: 2px; padding: 12px; }
    .stat-label { font-size: 10px; color: #888; margin-bottom: 4px; letter-spacing: 2px; }
    .stat-value { font-family: 'Bebas Neue', cursive; font-size: 32px; }
    .queue-section { margin: 0 12px 32px; background: #fff; border-radius: 4px; border: 1px solid #e0d8d0; overflow: hidden; }
    .queue-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid #e0d8d0; }
    .queue-title { font-family: 'Bebas Neue', cursive; font-size: 20px; letter-spacing: 1px; }
    .queue-badge { font-size: 10px; background: #f0e8dc; padding: 4px 10px; border-radius: 20px; color: #555; }
    .queue-empty { padding: 24px; text-align: center; color: #888; font-size: 14px; }
    .token-row { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid #f0e8dc; gap: 12px; }
    .token-badge-d { font-family: 'Bebas Neue', cursive; font-size: 24px; background: #f0e8dc; padding: 8px 12px; border-radius: 2px; min-width: 60px; text-align: center; }
    .token-info { flex: 1; }
    .token-phone { font-size: 15px; font-weight: 500; }
    .token-time { font-size: 12px; color: #888; margin-top: 2px; }
    .token-wait { text-align: right; }
    .token-wait-label { font-size: 10px; color: #888; }
    .token-wait-value { font-family: 'Bebas Neue', cursive; font-size: 22px; }
  </style>
</head>
<body>
<div class="dash-header">
  <div>
    <div class="dash-brand">✂ ARUN SALOON</div>
    <div class="dash-subtitle">OWNER DASHBOARD</div>
  </div>
  <button class="settings-btn" onclick="toggleSettings()">⚙ SETTINGS</button>
</div>
<div id="settingsPanel" class="settings-panel">
  <div style="font-family:'Bebas Neue',cursive;font-size:24px;margin-bottom:16px;">Settings</div>
  <label class="s-label">Salon Ka Naam</label>
  <input class="s-input" id="salonName" value="Arun Saloon" />
  <label class="s-label">WhatsApp Number</label>
  <input class="s-input" id="sWhatsapp" placeholder="919784619102" />
  <label class="s-label">Average Wait Time (minutes)</label>
  <input class="s-input" type="number" id="sAvgWait" value="25" />
  <button class="save-btn" onclick="saveSettings()">Save Karo</button>
</div>
<div class="serving-card">
  <div class="serving-label">NOW SERVING</div>
  <div class="serving-number" id="nowServing">#0</div>
  <div class="serving-phone" id="servingPhone"></div>
  <button class="next-btn" onclick="nextCustomer()">NEXT CUSTOMER</button>
  <div class="stats-row">
    <div class="stat-box"><div class="stat-label">WAITING</div><div class="stat-value" id="waitingCount">0</div></div>
    <div class="stat-box"><div class="stat-label">AVG WAIT</div><div class="stat-value" id="avgWaitDisplay">25m</div></div>
  </div>
</div>
<div class="queue-section">
  <div class="queue-header">
    <span class="queue-title">Saloon</span>
    <span class="queue-badge" id="queueBadge">0 WAITING</span>
  </div>
  <div id="queueList"><div class="queue-empty">Abhi koi waiting nahi hai 🎉</div></div>
</div>
<script>
const SURL='https://papimnhnmnbkmtczshaa.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBhcGltbmhubW5ia210Y3pzaGFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzMjE5ODYsImV4cCI6MjA5Mzg5Nzk4Nn0.FWW7betV-K59LepczG9oKKYe7V1kI1krJ031tDRPVjk';
const sb=supabase.createClient(SURL,SKEY);
let cfg={whatsapp_number:'919784619102',avg_wait_minutes:25,current_token:0,salon_name:'Arun Saloon'};
async function loadCfg(){const{data}=await sb.from('settings').select('*').eq('id',1).single();if(data)cfg=data;return cfg;}
async function initDashboard(){
  await loadCfg();
  const today=new Date().toISOString().split('T')[0];
  if(cfg.last_reset!==today){await sb.from('settings').update({current_token:0,last_reset:today}).eq('id',1);cfg.current_token=0;}
  document.getElementById('sWhatsapp').value=cfg.whatsapp_number||'';
  document.getElementById('sAvgWait').value=cfg.avg_wait_minutes||25;
  document.getElementById('salonName').value=cfg.salon_name||'Arun Saloon';
  await refreshDash();
  setInterval(refreshDash,5000);
}
async function refreshDash(){
  await loadCfg();
  const today=new Date().toISOString().split('T')[0];
  const{data:toks}=await sb.from('tokens').select('*').eq('date',today).order('token_number',{ascending:true});
  const cur=cfg.current_token||0;
  const waiting=(toks||[]).filter(t=>t.token_number>cur);
  const curCust=(toks||[]).find(t=>t.token_number===cur);
  document.getElementById('nowServing').textContent='#'+cur;
  document.getElementById('servingPhone').textContent=curCust?'📞 +'+curCust.phone:'';
  document.getElementById('waitingCount').textContent=waiting.length;
  document.getElementById('avgWaitDisplay').textContent=cfg.avg_wait_minutes+'m';
  document.getElementById('queueBadge').textContent=waiting.length+' WAITING';
  const list=document.getElementById('queueList');
  if(!waiting.length){list.innerHTML='<div class="queue-empty">Abhi koi waiting nahi hai 🎉</div>';return;}
  list.innerHTML=waiting.map((t,i)=>`<div class="token-row"><div class="token-badge-d">#${t.token_number}</div><div class="token-info"><div class="token-phone">📞 ${t.phone}</div><div class="token-time">${new Date(t.created_at).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</div></div><div class="token-wait"><div class="token-wait-label">APPROX</div><div class="token-wait-value">${(i+1)*cfg.avg_wait_minutes}m</div></div></div>`).join('');
}
async function nextCustomer(){const next=(cfg.current_token||0)+1;await sb.from('settings').update({current_token:next}).eq('id',1);await refreshDash();}
function toggleSettings(){const p=document.getElementById('settingsPanel');p.style.display=p.style.display==='block'?'none':'block';}
async function saveSettings(){await sb.from('settings').update({salon_name:document.getElementById('salonName').value,whatsapp_number:document.getElementById('sWhatsapp').value,avg_wait_minutes:parseInt(document.getElementById('sAvgWait').value)}).eq('id',1);alert('Saved!');toggleSettings();await refreshDash();}
initDashboard();
</script>
</body>
</html>
